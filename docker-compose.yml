# Docker Compose deployment (single host with Sysbox installed).
secrets:
  github_access-token:
    file: ./access-token   # GitHub PAT. Never commit this file.

services:
  runner:
    build: .
    image: ghcr.io/moveyourdigital/docker-swarm-github-actions-runner:latest
    runtime: sysbox-runc
    restart: always
    secrets: [github_access-token]
    # Time for start.sh to remove the runner registration on stop.
    stop_grace_period: 30s
    environment:
      ORGANIZATION: ${ORGANIZATION:?set ORGANIZATION in .env}
      ACCESS_TOKEN_FILE: /run/secrets/github_access-token
      RUNNER_LABELS: ${RUNNER_LABELS:-sysbox}
    deploy:
      replicas: 3
